services:
  # PostgreSQL Database
  - type: pserv
    name: rebordev-postgres
    env: docker
    plan: free
    databases:
      - name: rebordev_db
        databaseName: rebordev_hub
        user: postgres

  # API Service
  - type: web
    name: rebordev-api
    env: node
    plan: free
    rootDir: apps/api
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rebordev-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://web-eta-two-88.vercel.app
      - key: PORT
        value: 10000

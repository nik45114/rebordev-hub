services:
  - type: web
    name: rebordev-hub-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd apps/api && pnpm install && pnpm build
    startCommand: cd apps/api && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://web-eta-two-88.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: rebordev-hub-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: rebordev-hub-db
    databaseName: rebordev_hub
    user: postgres
    region: frankfurt
    plan: free
